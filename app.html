    <style>
        body {
            background-color: #B3CDE0;
            /* 粉藍色天色背景 */
            font-family: 'PingFang TC', 'Microsoft JhengHei', 'Comic Sans MS', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            color: #5A4E4D;
        }

        .bg-pastel-blue {
            background-color: #B3CDE0 !important;
        }

        .hand-drawn {
            background-color: #FAFAFA;
            /* 純白與粉白便簽紙 */
            border: none;
            /* 手剪便簽紙造型：邊緣不對稱、微微曲折 */
            clip-path: polygon(1% 1%, 98% 0%, 100% 99%, 0% 98%, 1% 50%);
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.08);
            /* 淡淡陰影 */
        }

        .hand-drawn-border {
            background-color: #FAFAFA;
            border: none;
            clip-path: polygon(0% 2%, 99% 1%, 98% 98%, 1% 100%, 0% 50%);
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.08);
        }

        .hand-drawn-btn {
            background-color: #E8DCC4;
            /* 淺奶茶色 */
            color: #5A4E4D;
            /* 手繪原子筆或細代針筆的抖動感外框，粗細不一 */
            border: 2px solid #5A4E4D;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            transition: all 0.2s ease;
            cursor: pointer;
            box-shadow: 2px 3px 0px rgba(90, 78, 77, 0.6);

            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            /* 清晰溫潤的黑體 */

        }

        .hand-drawn-btn:hover {

            box-shadow: 3px 4px 0px rgba(90, 78, 77, 0.6);
            background-color: #F1E8D5;
        }

        .hand-drawn-btn:active {
            transform: scale(0.98);
            box-shadow: 1px 1px 0px rgba(90, 78, 77, 0.6);
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 120px;
            width: 120px;
            background-color: transparent;
            background-image: url('./item/drop.png');
            background-position: center bottom;
            background-size: contain;
            background-repeat: no-repeat;
            cursor: pointer;
            margin-top: -55px;
            border: none;
            border-radius: 0;
            box-shadow: none;
            filter: drop-shadow(0px 8px 6px rgba(90, 78, 77, 0.2));
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.1);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 32px;
            cursor: pointer;
            background: linear-gradient(to right, #E8DCC4 var(--value, 50%), #FAFAFA var(--value, 50%));
            border-radius: 255px 25px 225px 25px/25px 225px 25px 255px;
            border: 3px solid #5A4E4D;
            box-shadow: inset 1px 2px 4px rgba(0, 0, 0, 0.1), 2px 4px 0px rgba(90, 78, 77, 0.15);
        }

        .rain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 40;
            overflow: hidden;
        }

        .raindrop {
            position: absolute;
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            /* 圓點狀雨滴 */
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            80% {
                opacity: 1;
            }

            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }

        // 安全的 localStorage 包裝器，防止在 file:// 協議或隱私模式下崩潰
        const safeStorage = {
            getItem: (key, defaultValue) => {
                try {
                    const val = localStorage.getItem(key);
                    return val !== null ? val : defaultValue;
                } catch (e) {
                    console.warn("localStorage is not available, using temporary in-memory storage.", e);
                    if (!window.tempStorage) window.tempStorage = {};
                    return window.tempStorage[key] !== undefined ? window.tempStorage[key] : defaultValue;
                }
            },
            setItem: (key, value) => {
                try {
                    localStorage.setItem(key, value);
                } catch (e) {
                    console.warn("localStorage is not available, saving to temporary in-memory storage.", e);
                    if (!window.tempStorage) window.tempStorage = {};
                    window.tempStorage[key] = value.toString();
                }
            }
        };

        // 全局下雨動畫組件
        function RainEffect() {
            const [drops, setDrops] = useState([]);

            useEffect(() => {
                const newDrops = Array.from({ length: 40 }).map((_, i) => ({
                    id: i,
                    left: Math.random() * 100,
                    duration: 0.5 + Math.random() * 0.8,
                    delay: Math.random() * 2,
                }));
                setDrops(newDrops);
            }, []);

            return (
                <div className="rain-container">
                    {drops.map(drop => (
                        <div
                            key={drop.id}
                            className="raindrop"
                            style={{
                                left: `${drop.left}%`,
                                animationDuration: `${drop.duration}s`,
                                animationDelay: `${drop.delay}s`
                            }}
                        />
                    ))}
                </div>
            );
        }



        // 實景地圖組件
        function LeafletMap({ collectedElfs = [], onCollectElf }) {
            const mapRef = useRef(null);
            const collectedElfsRef = useRef(collectedElfs);

            useEffect(() => {
                collectedElfsRef.current = collectedElfs;
            }, [collectedElfs]);

            useEffect(() => {
                window.collectElf = (file) => {
                    if (onCollectElf) {
                        onCollectElf(file);
                    }
                };
                return () => {
                    delete window.collectElf;
                };
            }, [onCollectElf]);

            useEffect(() => {
                if (!mapRef.current) return;

                // 1. 初始化地圖（維持縮放層級 19，且不顯示預設的 zoom control）
                const map = L.map(mapRef.current, {
                    zoomControl: false
                }).setView([24.1372, 120.6868], 19);

                // 2. 載入極簡淡雅的 CartoDB Positron 圖資（maxZoom 為 20）
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                    maxZoom: 20,
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
                }).addTo(map);

                // 將縮放按鈕置於右下角，避免遮擋頂部 UI
                L.control.zoom({
                    position: 'bottomright'
                }).addTo(map);

                // 3. 定義角色與水分子圖標（路徑改為相對路徑 ./data/...）
                const playerIcon = L.icon({
                    iconUrl: './data/drop.png',
                    iconSize: [50, 50],
                    iconAnchor: [25, 25],
                    popupAnchor: [0, -25]
                });

                const waterDropIcon = L.icon({
                    iconUrl: './data/other.png',
                    iconSize: [40, 40],
                    iconAnchor: [20, 20],
                    popupAnchor: [0, -20]
                });

                // 4. 定義內部變數與初始生成
                let virtualDropsArray = [];
                let elfsArray = [];
                let playerMarker = null;
                let playerLatLng = L.latLng(24.1372, 120.6868); // 預設初始中心
                let hasGPSLocation = false;
                let watchId = null;
                let logicInterval = null;

                // 負責初始生成虛擬水分子的函式（緊鄰玩家）
                function generateVirtualDrops(centerLat, centerLng) {
                    const numberOfWaterDrops = 5;
                    for (let i = 1; i <= numberOfWaterDrops; i++) {
                        const randomOffsetLat = (Math.random() - 0.5) * 0.0015;
                        const randomOffsetLng = (Math.random() - 0.5) * 0.0015;

                        const virtualDropLat = centerLat + randomOffsetLat;
                        const virtualDropLng = centerLng + randomOffsetLng;

                        const waterDropMarker = L.marker([virtualDropLat, virtualDropLng], { icon: waterDropIcon }).addTo(map);
                        waterDropMarker.bindPopup("載入中...");
                        virtualDropsArray.push(waterDropMarker);
                    }
                }

                // 負責將多款不同外觀的小精靈隨機散佈在各地的函式
                function generateElfs(centerLat, centerLng) {
                    const numberOfElfs = 8;
                    const shuffled = [...ALL_ELFS].sort(() => 0.5 - Math.random());
                    const chosenElfs = shuffled.slice(0, numberOfElfs);

                    for (let j = 0; j < numberOfElfs; j++) {
                        const elfInfo = chosenElfs[j];
                        const wideOffsetLat = (Math.random() - 0.5) * 0.008;
                        const wideOffsetLng = (Math.random() - 0.5) * 0.008;

                        const elfLat = centerLat + wideOffsetLat;
                        const elfLng = centerLng + wideOffsetLng;

                        const elfIcon = L.icon({
                            iconUrl: `./item/A/${elfInfo.file}`,
                            iconSize: [45, 45],
                            iconAnchor: [22, 22],
                            popupAnchor: [0, -22]
                        });

                        const elfMarker = L.marker([elfLat, elfLng], { icon: elfIcon }).addTo(map);
                        elfMarker.elfInfo = elfInfo;
                        elfMarker.bindPopup("載入中...");

                        elfsArray.push(elfMarker);
                    }
                }

                // 動態位移與距離偵測
                function updateGameLogic() {
                    if (!playerLatLng) return;

                    // 1. 更新水分子邏輯
                    for (let k = 0; k < virtualDropsArray.length; k++) {
                        const currentDrop = virtualDropsArray[k];
                        const currentLatLng = currentDrop.getLatLng();

                        const walkOffsetLat = (Math.random() - 0.5) * 0.0001;

                        const newLatLng = L.latLng(currentLatLng.lat + walkOffsetLat, currentLatLng.lng + walkOffsetLng);

                        const distance = map.distance(playerLatLng, newLatLng);

                        if (distance <= 100) {

                            popupContent = `<span style="font-size: 14px;">💧 <b>虛擬水分子編號 ${k + 1}</b></span><br>` +
                                `距離您：${Math.round(distance)} 公尺<br>` +
                                `<span style="color: #99aab5;">【距離太遠無法收集】</span><br>` +

                    for (let m = 0; m < elfsArray.length; m++) {

                        const elfInfo = currentElf.elfInfo;
                        if (!elfInfo) continue;

                        const currentElfLatLng = currentElf.getLatLng();

                        const elfWalkLat = (Math.random() - 0.5) * 0.00005;
                        const elfWalkLng = (Math.random() - 0.5) * 0.00005;

                                <div style="text-align: center; font-family: 'PingFang TC', sans-serif; min-width: 150px;">
                                    <span style="font-size: 14px; font-weight: bold; color: #5A4E4D;">✨ <b>天氣精靈：${elfInfo.name}</b></span><br>
                                    <span style="font-size: 12px;">距離您：<b>${Math.round(elfDistance)}</b> 公尺</span><br>
                                    <span style="color: #99aab5; font-size: 12px;">【距離太遠無法收集】</span><br>

                                </div>

                // 立即生成初始標記，實現零延遲流暢載入！
                playerMarker = L.marker(playerLatLng, { icon: playerIcon }).addTo(map);
                playerMarker.bindPopup("<b>這是你當前的位置 (GPS 定位中...)</b>").openPopup();
                generateVirtualDrops(24.1372, 120.6868);
                generateElfs(24.1372, 120.6868);

                // 啟動每 3 秒更新的遊戲邏輯
                logicInterval = setInterval(updateGameLogic, 3000);

                // 檢查瀏覽器定位權限並設定 watchPosition
                if (navigator.geolocation) {
                    // watchPosition 監聽持續定位
                    watchId = navigator.geolocation.watchPosition(position => {
                        const userLat = position.coords.latitude;
                        const userLng = position.coords.longitude;

                        // 第一次取得真正的 GPS 位置時，將預設生成的所有物件無縫平移到真實位置
                        if (!hasGPSLocation) {
                            const latDiff = userLat - 24.1372;
                            const lngDiff = userLng - 120.6868;

                            // 平移水分子
                            virtualDropsArray.forEach(drop => {
                                const oldLatLng = drop.getLatLng();
                                drop.setLatLng([oldLatLng.lat + latDiff, oldLatLng.lng + lngDiff]);
                            });

                            // 平移小精靈
                            elfsArray.forEach(elf => {
                                const oldLatLng = elf.getLatLng();
                                elf.setLatLng([oldLatLng.lat + latDiff, oldLatLng.lng + lngDiff]);
                            });

                            // 順暢更新地圖中心
                            map.setView([userLat, userLng], 19);
                            playerMarker.bindPopup("<b>這是你當前的位置</b>").openPopup();
                            hasGPSLocation = true;
                        }

                        playerLatLng = L.latLng(userLat, userLng);
                        playerMarker.setLatLng(playerLatLng);
                    }, err => {
                        console.error("Geolocation watch error:", err);
                    }, {
                        enableHighAccuracy: true,
                        maximumAge: 1000,
                        timeout: 10000
                    });
                } else {
                    alert("您的瀏覽器不支援 GPS 定位功能。");
                }

                // 清理函數
                return () => {
                    if (watchId !== null) {
                        navigator.geolocation.clearWatch(watchId);
                    }
                    if (logicInterval !== null) {
                        clearInterval(logicInterval);
                    }
                    map.remove();
                };
            }, []);

            return <div ref={mapRef} className="w-full h-full rounded-3xl hand-drawn-border border-4 shadow-xl z-10 opacity-90 hand-drawn-map" />;

            const [stage, setStage] = useState('start'); // 'start', 'playing', 'result'
            const [score, setScore] = useState(0);
            const [timeLeft, setTimeLeft] = useState(30);
            const [drops, setDrops] = useState([]);
            const gameActive = useRef(false);
            const timerRef = useRef(null);
            const animationRef = useRef(null);
            const nextDropId = useRef(0);
            const lastSpawnTime = useRef(0);

            const startGame = () => {
                setScore(0);
                setTimeLeft(30);
                setDrops([]);
                setStage('playing');
                gameActive.current = true;
                lastSpawnTime.current = Date.now();
            };

            useEffect(() => {
                if (stage === 'playing') {
                    timerRef.current = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(timerRef.current);
                                gameActive.current = false;
                                setStage('result');
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => {
                    if (timerRef.current) clearInterval(timerRef.current);
                };
            }, [stage]);

            useEffect(() => {
                if (stage !== 'playing') return;

                const updatePositions = () => {
                    if (!gameActive.current) return;

                    const now = Date.now();
                    if (now - lastSpawnTime.current > 600) {
                        const newDrop = {
                            id: nextDropId.current++,
                            x: 5 + Math.random() * 90,
                            y: -10,
                            speed: 1.5 + Math.random() * 2.0,
                            size: 28 + Math.random() * 12
                        };
                        setDrops(prev => [...prev, newDrop]);
                        lastSpawnTime.current = now;
                    }

                    setDrops(prev => {
                        return prev
                            .map(drop => ({ ...drop, y: drop.y + drop.speed }))
                            .filter(drop => drop.y < 105);
                    });

                    animationRef.current = requestAnimationFrame(updatePositions);
                };

                animationRef.current = requestAnimationFrame(updatePositions);

                return () => {
                    if (animationRef.current) cancelAnimationFrame(animationRef.current);
                };
            }, [stage]);

            const handleCatchDrop = (id, e) => {
                e.stopPropagation();
                setScore(prev => prev + 1);
                setDrops(prev => prev.filter(drop => drop.id !== id));
            };

            if (stage === 'start') {

                                backgroundSize: '16px 16px'

                            {drops.map(drop => (
                                <div

            const [charScale, setCharScale] = useState(1);
            const [isDragging, setIsDragging] = useState(false);
            const [isEditingChar, setIsEditingChar] = useState(false);
            const dragStart = useRef({ x: 0, y: 0, startX: 0, startY: 0 });

            const handlePointerDown = (e) => {
                e.target.setPointerCapture(e.pointerId);
                setIsDragging(true);
                dragStart.current = {
                    x: e.clientX,
                    y: e.clientY,
                    startX: charPos.x,
                    startY: charPos.y
                };
                setIsEditingChar(true);
            };

            const handlePointerMove = (e) => {
                if (!isDragging) return;
                const dx = e.clientX - dragStart.current.x;
                const dy = e.clientY - dragStart.current.y;
                setCharPos({
                    x: dragStart.current.startX + dx,
                    y: dragStart.current.startY + dy
                });
            };

            const handlePointerUp = (e) => {
                setIsDragging(false);
                if (e.target.hasPointerCapture(e.pointerId)) {
                    e.target.releasePointerCapture(e.pointerId);
                }
            };

            const percentage = Math.round(((mood - 1) / 9) * 100);

            const renderAvatarModal = () => {
                if (!avatarModal) return null;
                const isClothes = avatarModal === 'clothes';

                                            className="flex-1 py-2 bg-[#FFF4CE] text-[#5A4E4D] border-[2px] border-[#5A4E4D] font-bold text-sm rounded-full hover:bg-[#F9E596] hover:-translate-y-0.5 active:translate-y-0 transition-all shadow-sm"
                                        >
                                            📋 複製名片資訊
                                        </button>
                                    </div>
                                </div>
                            );
                        }
                        return null;
                    case 'analysis':
                        const weeklyData = [5, 7, 6, 8, 4, 9, Number(mood)];
                        const dates = Array.from({ length: 7 }).map((_, i) => {
                            const d = new Date();
                            d.setDate(d.getDate() - (6 - i));
                            return `${d.getMonth() + 1}/${d.getDate()}`;

                        return (
                            <div className="flex flex-col h-full min-h-[300px]">

            const mileage = (steps * 0.00075).toFixed(2);

            const startPedometer = () => {
                if (sensorActive) return;

                if (typeof window.DeviceMotionEvent !== 'undefined') {
                    if (typeof DeviceMotionEvent.requestPermission === 'function') {
                        DeviceMotionEvent.requestPermission()
                            .then(permissionState => {
                                if (permissionState === 'granted') {
                                    registerMotionListener();
                                } else {
                                    setToastMessage("計步感測器授權失敗，可使用模擬按鈕累積步數。");
                                    setTimeout(() => setToastMessage(''), 3000);
                                }
                            })
                            .catch(err => {
                                console.error("DeviceMotion permission error:", err);
                                setToastMessage("啟動感測器出錯，可使用模擬按鈕。");
                                setTimeout(() => setToastMessage(''), 3000);
                            });
                    } else {
                        registerMotionListener();
                    }
                } else {
                    setToastMessage("此裝置不支援計步感測器，可使用模擬按鈕。");
                    setTimeout(() => setToastMessage(''), 3000);
                }
            };

            const registerMotionListener = () => {
                if (motionListenerRef.current) return;

                const handleMotion = (event) => {
                    const acc = event.accelerationIncludingGravity || event.acceleration;
                    if (!acc || acc.x === null || acc.y === null || acc.z === null) return;

                    const mag = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
                    const now = Date.now();

                    if (runningAvg.current === 0) {
                        runningAvg.current = mag;
                    } else {
                        runningAvg.current = runningAvg.current * 0.9 + mag * 0.1;
                    }

                    const delta = Math.abs(mag - runningAvg.current);
                    if (delta > 2.2 && (now - lastStepTime.current > 350)) {
                        lastStepTime.current = now;
                        setSteps(prev => {
                            const next = prev + 1;
                            safeStorage.setItem('pedometer_steps', next.toString());
                            return next;
                        });
                    }
                };

                window.addEventListener('devicemotion', handleMotion, true);
                motionListenerRef.current = handleMotion;
                setSensorActive(true);
                setToastMessage("🟢 計步感測器啟動成功！");
                setTimeout(() => setToastMessage(''), 2500);
            };

                                    ✖
                                </button>

                                <h2 className="text-2xl font-bold mb-2 text-center text-primary">👟 記步任務與里程挑戰</h2>
                                <p className="text-xs text-center opacity-80 font-bold mb-4">累積每日步伐，兌換種子道具</p>

                                {/* Sensor Status Card */}
                                <div className="bg-[#FAF6F0] border-2 border-[#5A4E4D] rounded-2xl p-3 mb-4 text-left shadow-inner flex justify-between items-center">
                                    <div>
                                        <span className="text-[10px] font-bold text-primary/60 block">計步器狀態</span>
                                        <span className="text-xs font-bold text-primary">
                                            {sensorActive ? "🟢 感測器已啟動 (偵測中)" : "🟡 感測器未啟動"}
                                        </span>
                                    </div>
                                    {!sensorActive && (
                                        <button
                                            onClick={startPedometer}
                                            className="px-3 py-1 bg-[#FFF4CE] text-[#5A4E4D] border border-[#5A4E4D] font-bold text-[10px] rounded-full hover:bg-[#F9E596] active:scale-95 transition-all shadow-sm"
                                        >
                                            🔋 啟動手機感測器
                                        </button>
                                    )}
                                </div>

                                {/* Step & Mileage Giant Display */}
                                <div className="bg-white border-[3px] border-[#5A4E4D] p-4 rounded-3xl mb-4 text-center shadow-md relative">
                                    <div className="text-xs font-bold text-primary/60">目前累積</div>
                                    <div className="text-4xl font-extrabold text-accent my-2 tracking-wide">
                                        {steps} <span className="text-lg font-bold text-primary/80">步</span>
                                    </div>
                                    <div className="text-sm font-bold text-[#5A4E4D]">
                                        里程數：<span className="text-lg font-extrabold">{mileage}</span> 公里
                                    </div>
                                </div>

                                {/* Goal Progress Bar */}
                                <div className="mb-4">
                                    <div className="flex justify-between items-center text-[10px] font-bold text-primary/60 mb-1 px-1">
                                        <span>今日目標 (5,000 步)</span>
                                        <span>{Math.min(100, Math.round((steps / 5000) * 100))}%</span>
                                    </div>
                                    <div className="w-full bg-[#E5DCD3] h-4 rounded-full border-2 border-[#5A4E4D] overflow-hidden shadow-inner">
                                        <div
                                            className="bg-[#81C784] h-full transition-all duration-500"
                                            style={{ width: `${Math.min(100, (steps / 5000) * 100)}%` }}
                                        />
                                    </div>
                                </div>

                                {/* Simulator/Manual add steps */}
                                <div className="flex gap-2 mb-4">
                                    <button
                                        onClick={() => {
                                            setSteps(prev => {
                                                const next = prev + 100;
                                                safeStorage.setItem('pedometer_steps', next.toString());
                                                return next;
                                            });
                                        }}
                                        className="w-full py-2 bg-white text-primary border-2 border-[#5A4E4D] font-bold text-xs rounded-full hover:bg-beige transition-all shadow-sm"
                                    >
                                        🚶 模擬漫步 (+100 步)
                                    </button>
                                </div>

                                {/* Reward Exchange Panel */}
                                <div className="bg-[#FAF8F5] p-3 rounded-2xl border-2 border-[#5A4E4D] shadow-sm flex-1 flex flex-col justify-start">
                                    <span className="text-xs font-bold text-primary block mb-2 border-b border-[#5A4E4D]/10 pb-1 text-left">
                                        🎁 消耗步數兌換種子：
                                    </span>
                                    <div className="flex flex-col gap-2 overflow-y-auto custom-scrollbar flex-1 pr-1">
                                        {[
                                            { id: 'seed_cotton', name: '🌾 棉花種子', cost: 50 },
                                            { id: 'seed_lavender', name: '🪻 薰衣草種子', cost: 100 },
                                            { id: 'seed_hydrangea', name: '🌸 繡球花種子', cost: 150 },
                                        ].map(reward => (
                                            <div key={reward.id} className="flex justify-between items-center bg-white p-2 rounded-xl border border-[#DCEAF2] shadow-sm">
                                                <div className="flex flex-col text-left">
                                                    <span className="text-xs font-bold text-primary">{reward.name}</span>
                                                    <span className="text-[9px] font-bold text-primary/50">花費 {reward.cost} 步</span>
                                                </div>
                                                <button
                                                    onClick={() => {
                                                        if (steps < reward.cost) {
                                                            setToastMessage("步數不足，快去散步累積里程吧！");
                                                            setTimeout(() => setToastMessage(''), 3000);
                                                            return;
                                                        }
                                                        setSteps(prev => {
                                                            const next = prev - reward.cost;
                                                            safeStorage.setItem('pedometer_steps', next.toString());
                                                            return next;
                                                        });
                                                        setBackpackItems(prev => ({
                                                            ...prev,
                                                            [reward.id]: (prev[reward.id] || 0) + 1
                                                        }));
                                                        setToastMessage(`成功兌換 1 顆${reward.name.split(' ')[1]}！已放入背包`);
                                                        setTimeout(() => setToastMessage(''), 3000);
                                                    }}
                                                    className="px-3 py-1 bg-[#FFF4CE] hover:bg-[#F9E596] text-[#5A4E4D] border border-[#5A4E4D] font-bold text-[10px] rounded-full active:scale-95 transition-all shadow-sm"
                                                >
                                                    兌換
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- 主應用邏輯 ---
        function App() {
            const [step, setStep] = useState('loading');
            const [nickname, setNickname] = useState('');
            const [hasCheckedIn, setHasCheckedIn] = useState(false);
            const [mood, setMood] = useState(5);
            const [rewards, setRewards] = useState({ seeds: 0, water: 0 });
            const [showModal, setShowModal] = useState(false);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [finalParts, setFinalParts] = useState({});

            useEffect(() => {
                const audio = document.getElementById('bgMusic');
                if (audio) {
                    audio.volume = 0.5;
                    const playPromise = audio.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(error => {
                            console.log("Autoplay prevented. Music will start upon interaction.");
                            const startMusic = () => {
                                audio.play();
                                document.removeEventListener('click', startMusic);
                                document.removeEventListener('touchstart', startMusic);
                            };
                            document.addEventListener('click', startMusic);
                            document.addEventListener('touchstart', startMusic);
                        });
                    }
                }
            }, []);

            useEffect(() => {
                if (step === 'loading') {
                    const timer = setTimeout(() => {
                        setStep('login');
                    }, 2000);
                    return () => clearTimeout(timer);
                }
            }, [step]);

            const handleLoginSubmit = (e) => {
                e.preventDefault();
                if (!nickname.trim()) return;
                routeAfterAuth();
            };

            const handleRegisterSubmit = (e) => {
                e.preventDefault();
                if (!nickname.trim()) return;
                setStep('avatar');
            };

            const handleAvatarSubmit = () => {
                routeAfterAuth();
            };

            const routeAfterAuth = () => {
                if (hasCheckedIn) {
                    setStep('personal');
                } else {
                    setStep('mood');
                }
            };

            const handleMoodSubmit = () => {
                setHasCheckedIn(true);
                setStep('personal'); // Skip mood_analysis and go straight to personal space
            };

            const handleAnalysisSubmit = () => {
                const earnedSeeds = Math.floor(Math.random() * 5) + 1;
                const earnedWater = Math.floor(Math.random() * 20) + 10;
                setRewards({ seeds: earnedSeeds, water: earnedWater });
                setShowModal(true);
            };

            const confirmCheckIn = () => {
                setShowModal(false);
                setHasCheckedIn(true);
                setStep('personal');
            };

            return (
                <div className="h-screen w-screen text-primary overflow-hidden font-sans relative">
                    <audio id="bgMusic" src="./item/music/main%20music.mp3" loop autoPlay preload="auto"></audio>
                    <CloudsBackground />
                    <RainEffect />

                    {/* 右上角天氣資訊與 75% 亮點已移除 */}

                    <div className="h-full w-full relative z-10">
                        {step === 'loading' && <LoadingScreen />}
                        {step === 'landing' && <LandingScreen setStep={setStep} />}
                        {step === 'login' && <AuthScreen type="login" nickname={nickname} setNickname={setNickname} onSubmit={handleLoginSubmit} setStep={setStep} />}
                        {step === 'register' && <AuthScreen type="register" nickname={nickname} setNickname={setNickname} onSubmit={handleRegisterSubmit} setStep={setStep} />}
                        {step === 'avatar' && <AvatarSetupScreen onSubmit={handleAvatarSubmit} />}

                        {step === 'mood' && (
                            <MoodCheckIn mood={mood} setMood={setMood} onSubmit={handleMoodSubmit} nickname={nickname} />
                        )}
                        {step === 'mood_analysis' && (
                            <MoodAnalysis mood={mood} onSubmit={handleAnalysisSubmit} />
                        )}

                        {(step === 'personal' || step === 'public') && (
                            <Layout isSidebarOpen={isSidebarOpen} setIsSidebarOpen={setIsSidebarOpen} setStep={setStep} currentStep={step}>
                                {step === 'personal' ? <PersonalSpace mood={mood} nickname={nickname} finalParts={finalParts} setFinalParts={setFinalParts} /> : <PublicSpace nickname={nickname} finalParts={finalParts} />}
                            </Layout>
                        )}

                        {showModal && (
                            <div className="fixed inset-0 bg-primary/60 backdrop-blur-md flex items-center justify-center z-50 p-4">
                                <div className="bg-white p-8 hand-drawn-border max-w-sm w-full text-center shadow-2xl transform transition-all scale-100 animate-bounce-short">
                                    <div className="text-7xl mb-4 drop-shadow-md">🌱</div>
                                    <h3 className="text-3xl font-bold mb-4 text-accent bg-primary rounded-xl py-1">簽到獎勵！</h3>
                                    <p className="text-xl mb-2 font-bold">獲得了 <span className="text-accent text-4xl mx-1">{rewards.seeds}</span> 顆種子</p>
                                    <p className="text-xl mb-8 font-bold">與 <span className="text-blue-500 text-4xl mx-1">{rewards.water}</span> 滴水分子</p>
                                    <button onClick={confirmCheckIn} className="hand-drawn-btn w-full py-4 text-2xl font-bold shadow-lg">
                                        進入個人空間
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
